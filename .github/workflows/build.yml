name: Build Patched Runtime
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-multilib \
            g++-multilib \
            flex \
            bison \
            autoconf \
            automake \
            pkg-config \
            libgnutls-dev \
            libx11-dev \
            libx11-dev:i386 \
            libfreetype-dev \
            libfreetype-dev:i386 \
            libvulkan-dev \
            libvulkan-dev:i386
      - name: Configure and Build
        run: |
          ./autogen.sh
          ./configure --enable-win64
          make -j$(nproc)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xodus-patched-runtime
          path: ./