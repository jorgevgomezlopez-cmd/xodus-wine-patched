name: Build Patched Runtime
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-multilib \
            g++-multilib \
            flex \
            bison \
            autoconf \
            automake \
            pkg-config \
            libgnutls28-dev \
            libx11-dev \
            libx11-dev:i386 \
            libfreetype-dev \
            libfreetype-dev:i386 \
            libvulkan-dev \
            libvulkan-dev:i386 \
            libdrm-dev \
            libgl-dev \
            libegl-dev \
            libxi-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxext-dev \
            libxrender-dev \
            libxinerama-dev \
            libxxf86vm-dev
      - name: Configure and Build
        run: |
          tools/make_requests
          tools/make_specfiles
          python3 dlls/winevulkan/make_vulkan -x vk.xml -X video.xml
          autoreconf -ifv
          ./configure --enable-win64 --disable-tests
          make -j$(nproc)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xodus-patched-runtime
          path: ./